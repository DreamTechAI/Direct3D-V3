[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "direct3d-v3"
version = "0.1.0"
readme = "README.md"
description = "Image-conditioned 3D mesh generation with latent-free diffusion transformers"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[project.optional-dependencies]
demo = ["gradio>=5.50,<7"]

[project.scripts]
direct3d = "infer:main"

[tool.setuptools]
packages = ["direct3d", "direct3d.models", "direct3d.utils", "direct3d.schedulers"]
py-modules = ["infer"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
